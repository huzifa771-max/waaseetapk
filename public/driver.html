<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Waseet Driver</title><style>*{box-sizing:border-box}body{margin:0;font-family:Arial;background:#f4f8fc;color:#10243e}.top{background:#075fc9;color:#fff;padding:18px}.wrap{max-width:1050px;margin:auto;padding:18px}.card{background:#fff;border-radius:18px;padding:18px;margin:12px 0;box-shadow:0 7px 24px #1231}.item{border:1px solid #e0e8f2;border-radius:12px;padding:13px;margin:9px 0}input,textarea{width:100%;padding:12px;border:1px solid #d5e0ed;border-radius:10px;margin:5px 0 9px}button{border:0;border-radius:10px;padding:11px 15px;background:#075fc9;color:#fff;font-weight:700}.secondary{background:#eaf2fb;color:#075fc9}.hide{display:none}.muted{color:#64748b;font-size:13px}.row{display:flex;gap:8px;flex-wrap:wrap}</style></head><body><header class="top"><div class="wrap"><b>WASEET DRIVER</b><div>تحميل · نقل · تسليم · توثيق</div></div></header><main class="wrap"><section id="auth" class="card"><h2>دخول السائق</h2><input id="email" type="email" placeholder="البريد الإلكتروني"><input id="phone" placeholder="+9665xxxxxxxx"><div class="row"><button onclick="emailLogin()">رابط البريد</button><button class="secondary" onclick="phoneLogin()">SMS</button></div><div id="verify" class="hide"><input id="otp" placeholder="رمز التحقق"><button onclick="verifyPhone()">تحقق</button></div><p id="msg" class="muted"></p></section><section id="onboard" class="card hide"><h2>ملف السائق</h2><input id="name" placeholder="الاسم الكامل"><button onclick="saveProfile()">حفظ وإرسال للمراجعة</button></section><section id="app" class="hide"><div class="card"><h2 id="welcome"></h2><section id="documentsBox" class="card"><h2>مستندات السائق</h2><p class="muted">الهوية، الرخصة، استمارة المركبة والتأمين.</p><div id="documentInputs"></div><div id="documentList"></div></section><button class="secondary" onclick="openNotifications()">الإشعارات <span id="notifCount"></span></button><button onclick="logout()">خروج</button></div><div id="notificationsBox" class="card hide"><h2>الإشعارات</h2><div id="notificationsList"></div></div><div class="card"><h2>المهام المسندة</h2><div id="tasks"></div></div><div id="taskBox" class="card hide"><h2 id="taskTitle"></h2><input id="plate" placeholder="رقم لوحة المركبة"><input id="driverPhone" placeholder="هاتف السائق"><input id="eta" type="datetime-local"><input id="proof" placeholder="رابط إثبات التحميل"><input id="deliveryProof" placeholder="رابط إثبات التسليم"><div class="row"><button onclick="saveShipment()">حفظ بيانات الرحلة</button><button onclick="advanceShipment('loading')">بدء التحميل</button><button onclick="advanceShipment('in_transit')">بدء النقل</button><button onclick="advanceShipment('delivered')">تأكيد التسليم</button><button class="secondary" onclick="updateLocation()">تحديث موقعي</button></div><p id="status" class="muted"></p></div></section></main><script src="/shared/supabase.js"></script><script src="/shared/auth.js"></script><script src="/shared/shipping.js"></script><script>
let me,active;const M=t=>msg.textContent=t;async function emailLogin(){let r=await WaseetAuth.sendEmail(email.value.trim());M(r.error?r.error.message:'تم إرسال رابط آمن للبريد')}async function phoneLogin(){pending=phone.value.trim();let r=await WaseetAuth.sendPhone(pending);if(r.error)M(r.error.message);else{verify.classList.remove('hide');M('تم إرسال الرمز')}}async function verifyPhone(){let r=await WaseetAuth.verifyPhone(pending,otp.value.trim());if(r.error)M(r.error.message);else boot()}async function saveProfile(){let r=await WaseetAuth.saveProfile({role:'driver',full_name:name.value,phone:phone.value||null,email:email.value||null,verification_status:'pending'});M(r.error?r.error.message:'تم حفظ الملف');if(!r.error)boot()}
async function boot(){let s=await WaseetAuth.session();if(!s)return;me=await WaseetAuth.profile();if(!me){auth.classList.add('hide');onboard.classList.remove('hide');return}auth.classList.add('hide');onboard.classList.add('hide');app.classList.remove('hide');loadDocuments();welcome.textContent='مرحباً '+(me.full_name||'');let ds=await WaseetData.deals();tasks.innerHTML=ds.map(d=>'<div class="item"><b>صفقة '+d.id.slice(0,8)+'</b> · '+d.stage+' · '+d.status+'<div class="row"><button onclick="openTask(\''+d.id+'\')">فتح المهمة</button></div></div>').join('')||'لا توجد مهام مسندة'}
async function openTask(id){active=id;taskBox.classList.remove('hide');taskTitle.textContent='مهمة الصفقة '+id.slice(0,8);let s=(await waseetClient.from('shipments').select('*').eq('deal_id',id).maybeSingle()).data;if(s){plate.value=s.vehicle_plate||'';driverPhone.value=s.driver_phone||'';eta.value=s.expected_arrival?new Date(s.expected_arrival).toISOString().slice(0,16):'';proof.value=s.loading_proof_url||''}}
async function advanceShipment(next){if(!active)return;let payload={status:next};if(next==='loading')payload.loading_proof_url=proof.value||null;if(next==='delivered')payload.delivery_proof_url=deliveryProof.value||null;let r=await waseetClient.from('shipments').update(payload).eq('deal_id',active);status.textContent=r.error?r.error.message:'تم تحديث حالة الشحنة إلى '+next;boot();}
async function saveShipment(){let r=await waseetClient.from('shipments').upsert({deal_id:active,driver_id:me.id,vehicle_plate:plate.value,driver_phone:driverPhone.value,expected_arrival:eta.value?new Date(eta.value).toISOString():null,loading_proof_url:proof.value,status:'assigned'},{onConflict:'deal_id'});status.textContent=r.error?r.error.message:'بيانات الرحلة محفوظة؛ يمكن للإدارة متابعة الحالة.'}
async function updateLocation(){if(!navigator.geolocation){status.textContent='المتصفح لا يدعم الموقع';return}navigator.geolocation.getCurrentPosition(async p=>{let r=await waseetClient.from('shipments').update({current_lat:p.coords.latitude,current_lng:p.coords.longitude,last_location_at:new Date().toISOString()}).eq('deal_id',active);status.textContent=r.error?r.error.message:'تم تحديث الموقع';},e=>status.textContent=e.message,{enableHighAccuracy:true})}
async function openNotifications(){notificationsBox.classList.remove("hide");let ns=await WaseetNotifications.list();WaseetNotifications.render(notificationsList,ns);notifCount.textContent="("+await WaseetNotifications.unread()+")"} 
async function loadDocuments(){if(!window.WaseetDocuments||!me)return;let req=await WaseetDocuments.requirements(me.role);documentInputs.innerHTML=req.map(t=>'<div class="item"><b>'+t+'</b><input type="file" id="doc_'+t+'" accept=".pdf,.jpg,.jpeg,.png"></div>').join('');let docs=await WaseetDocuments.mine();documentList.innerHTML=docs.map(d=>'<div class="item">'+d.document_type+' · '+d.status+'</div>').join('')||'<span class="muted">لم ترفع مستندات بعد</span>';req.forEach(t=>{let el=document.getElementById('doc_'+t);el.onchange=async()=>{if(!el.files[0])return;try{await WaseetDocuments.upload(t,el.files[0]);await loadDocuments()}catch(e){alert(e.message)}}})}
async function logout(){await WaseetAuth.signOut();location.reload()}boot();waseetClient.auth.onAuthStateChange(()=>setTimeout(boot,200));
</script></body></html>
