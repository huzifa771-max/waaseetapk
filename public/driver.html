<!doctype html><html lang="ar" dir="rtl"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Waseet Driver</title><style>*{box-sizing:border-box}body{margin:0;font-family:Arial;background:#f5f8fc;color:#10243e}.top{background:#075fc9;color:#fff;padding:18px}.wrap{max-width:1100px;margin:auto;padding:18px}.card{background:#fff;border-radius:18px;padding:20px;margin:14px 0;box-shadow:0 8px 26px #1231 0 0 0}input,select,textarea{width:100%;padding:12px;border:1px solid #d8e2ee;border-radius:10px;margin:6px 0 10px}button{border:0;border-radius:10px;padding:12px 16px;background:#075fc9;color:#fff;font-weight:700}.secondary{background:#eaf2fb;color:#075fc9}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}.hide{display:none}.muted{color:#60738a;font-size:13px}@media(max-width:800px){.grid{grid-template-columns:1fr}} </style><header class="top"><div class="wrap"><b>WASEET DRIVER</b><div>تشغيل النقل والتسليم</div></div></header><main class="wrap"><section id="auth" class="card"><h2>دخول السائق</h2><input id="email" type="email" placeholder="البريد الإلكتروني"><input id="phone" placeholder="+9665xxxxxxxx"><button onclick="emailLogin()">رابط البريد</button> <button class="secondary" onclick="phoneLogin()">SMS</button><div id="verify" class="hide"><input id="otp" placeholder="رمز التحقق"><button onclick="verifyPhone()">تحقق</button></div><p id="msg" class="muted"></p></section><section id="onboard" class="card hide"><h2>بيانات السائق</h2><input id="name" placeholder="الاسم الكامل"><button onclick="saveProfile()">حفظ وإرسال للتحقق</button></section><section id="app" class="hide"><div class="card"><h1>لوحة السائق</h1><p id="welcome"></p><button onclick="logout()">خروج</button></div><div class="card"><h2>المهام المسندة</h2><div id="tasks"></div></div></section></main><script src="/shared/supabase.js"></script><script src="/shared/auth.js"></script><script>
let pending;const M=t=>msg.textContent=t;async function emailLogin(){let r=await WaseetAuth.sendEmail(email.value.trim());M(r.error?r.error.message:'تم إرسال رابط آمن للبريد')}async function phoneLogin(){pending=phone.value.trim();let r=await WaseetAuth.sendPhone(pending);if(r.error)M(r.error.message);else{verify.classList.remove('hide');M('تم إرسال الرمز')}}async function verifyPhone(){let r=await WaseetAuth.verifyPhone(pending,otp.value.trim());if(r.error)M(r.error.message);else boot()}async function saveProfile(){let r=await WaseetAuth.saveProfile({role:'driver',full_name:name.value,phone:phone.value||null,email:email.value||null});if(r.error)M(r.error.message);else boot()}async function boot(){let s=await WaseetAuth.session();if(!s)return;let p=await WaseetAuth.profile();if(!p){auth.classList.add('hide');onboard.classList.remove('hide');return}auth.classList.add('hide');onboard.classList.add('hide');app.classList.remove('hide');welcome.textContent='مرحباً '+(p.full_name||'');let ds=await WaseetData.deals();tasks.innerHTML=ds.length?ds.map(d=>'<div class="card"><b>'+d.id.slice(0,8)+'</b><br>المرحلة: '+d.stage+'<br>المبلغ: '+d.total_amount+' ريال</div>').join(''):'لا توجد مهام مسندة'}async function logout(){await WaseetAuth.signOut();location.reload()}boot();waseetClient.auth.onAuthStateChange(()=>setTimeout(boot,100));</script></html>
