<!doctype html><html lang="ar" dir="rtl"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Waseet Trade</title><style>*{box-sizing:border-box}body{margin:0;font-family:Arial;background:#f5f8fc;color:#10243e}.top{background:#075fc9;color:#fff;padding:18px}.wrap{max-width:1100px;margin:auto;padding:18px}.card{background:#fff;border-radius:18px;padding:20px;margin:14px 0;box-shadow:0 8px 26px #1231 0 0 0}input,select,textarea{width:100%;padding:12px;border:1px solid #d8e2ee;border-radius:10px;margin:6px 0 10px}button{border:0;border-radius:10px;padding:12px 16px;background:#075fc9;color:#fff;font-weight:700}.secondary{background:#eaf2fb;color:#075fc9}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}.hide{display:none}.muted{color:#60738a;font-size:13px}@media(max-width:800px){.grid{grid-template-columns:1fr}} </style><header class="top"><div class="wrap"><b>WASEET TRADE</b><div>وسيط · تجارة · لوجستيات · ثقة</div></div></header><main class="wrap">
<section id="auth" class="card"><h2>تسجيل الدخول / إنشاء حساب</h2><select id="role"><option value="merchant">تاجر</option><option value="supplier">مورد</option></select><input id="email" type="email" placeholder="البريد الإلكتروني"><input id="phone" placeholder="+9665xxxxxxxx"><button onclick="emailLogin()">رابط دخول بالبريد</button> <button class="secondary" onclick="phoneLogin()">رمز SMS</button><div id="verify" class="hide"><input id="otp" placeholder="رمز التحقق"><button onclick="verifyPhone()">تحقق</button></div><p id="msg" class="muted"></p></section>
<section id="onboard" class="card hide"><h2>إكمال بيانات المنشأة</h2><input id="name" placeholder="الاسم الكامل"><input id="biz" placeholder="اسم المنشأة"><input id="addr" placeholder="عنوان النشاط"><button onclick="saveProfile()">حفظ</button></section>
<section id="app" class="hide"><div class="card"><h1 id="welcome"></h1><p>طلب → عروض → تفاوض → دفع → تحميل → سائق → نقل → استلام → فحص → تسوية → إغلاق / نزاع</p><button onclick="logout()">تسجيل الخروج</button></div>
<div class="grid"><div class="card"><b id="rc">0</b><br>الطلبات</div><div class="card"><b id="dc">0</b><br>الصفقات</div><div class="card"><b id="pc">0</b><br>المنتجات</div></div>
<div id="merchant" class="card hide"><h2>طلب شراء</h2><input id="pn" placeholder="اسم المنتج"><input id="qty" type="number" placeholder="الكمية"><input id="weight" type="number" placeholder="الوزن"><input id="origin" placeholder="بلد المنشأ"><input id="dest" placeholder="الوجهة"><textarea id="desc" placeholder="الوصف والمواصفات"></textarea><button onclick="createRequest()">نشر الطلب</button></div>
<div id="supplier" class="card hide"><h2>طلبات التجار</h2><div id="requests"></div><h2>إضافة منتج</h2><input id="prod" placeholder="اسم المنتج"><input id="price" type="number" placeholder="السعر"><input id="pqty" type="number" placeholder="الكمية"><button onclick="addProduct()">نشر المنتج</button></div>
<div class="card"><h2>الصفقات</h2><div id="deals"></div></div></section></main>
<script src="/shared/supabase.js"></script><script src="/shared/auth.js"></script><script>
let pending;const M=t=>msg.textContent=t;
async function emailLogin(){let r=await WaseetAuth.sendEmail(email.value.trim());M(r.error?r.error.message:'تم إرسال رابط دخول آمن إلى البريد.')}
async function phoneLogin(){pending=phone.value.trim();let r=await WaseetAuth.sendPhone(pending);if(r.error)M(r.error.message);else{verify.classList.remove('hide');M('تم إرسال الرمز')}}
async function verifyPhone(){let r=await WaseetAuth.verifyPhone(pending,otp.value.trim());if(r.error)M(r.error.message);else boot()}
async function saveProfile(){let r=await WaseetAuth.saveProfile({role:role.value,full_name:name.value,business_name:biz.value,address:addr.value,phone:phone.value||null,email:email.value||null});if(r.error)M(r.error.message);else boot()}
async function boot(){let s=await WaseetAuth.session();if(!s)return;let p=await WaseetAuth.profile();if(!p){auth.classList.add('hide');onboard.classList.remove('hide');return}auth.classList.add('hide');onboard.classList.add('hide');app.classList.remove('hide');welcome.textContent='مرحباً '+(p.business_name||p.full_name||'');merchant.classList.toggle('hide',p.role!=='merchant');supplier.classList.toggle('hide',p.role!=='supplier');let [rs,ds,ps]=await Promise.all([WaseetData.requests(),WaseetData.deals(),WaseetData.products()]);rc.textContent=p.role==='merchant'?rs.filter(x=>x.merchant_id===p.id).length:rs.length;dc.textContent=ds.length;pc.textContent=ps.filter(x=>x.supplier_id===p.id).length;deals.innerHTML=ds.length?ds.map(x=>'<div class="card">'+x.id.slice(0,8)+' · '+x.stage+' · '+x.total_amount+' ريال</div>').join(''):'لا توجد صفقات';if(p.role==='supplier')requests.innerHTML=rs.map(x=>'<div class="card"><b>'+x.product_name+'</b> · '+x.quantity+' · '+(x.destination||'')+'</div>').join('')||'لا توجد طلبات'}
async function createRequest(){let s=await WaseetAuth.session();let r=await waseetClient.from('purchase_requests').insert({merchant_id:s.user.id,product_name:pn.value,quantity:+qty.value,weight:+weight.value||null,origin_country:origin.value,destination:dest.value,description:desc.value});M(r.error?r.error.message:'تم نشر الطلب');if(!r.error)boot()}
async function addProduct(){let s=await WaseetAuth.session();let r=await waseetClient.from('products').insert({supplier_id:s.user.id,name:prod.value,price:+price.value,quantity:+pqty.value});M(r.error?r.error.message:'تم نشر المنتج')}
async function logout(){await WaseetAuth.signOut();location.reload()}boot();waseetClient.auth.onAuthStateChange(()=>setTimeout(boot,100));
</script></html>
