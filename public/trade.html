<!doctype html>
<html lang="ar" dir="rtl"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Waseet Trade</title>
<style>
*{box-sizing:border-box}body{margin:0;font-family:Arial,sans-serif;background:#f5f8fc;color:#10243e}.top{background:#075fc9;color:#fff;padding:18px}.wrap{max-width:1180px;margin:auto;padding:18px}.brand{font-size:23px;font-weight:800}.muted{opacity:.82;font-size:13px}.hero,.card{background:#fff;border-radius:18px;padding:20px;box-shadow:0 8px 26px #1231 0 0 0;margin-bottom:16px}.hero{background:linear-gradient(135deg,#075fc9,#0b72e8);color:#fff}.grid{display:grid;grid-template-columns:2fr 1fr;gap:16px}.cards{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}.metric{background:#f8fbff;border:1px solid #e1eaf3;border-radius:14px;padding:16px}.num{font-size:25px;font-weight:800;color:#075fc9}.steps{display:grid;grid-template-columns:repeat(7,1fr);gap:6px}.step{padding:10px 5px;text-align:center;border-radius:10px;background:#edf2f7;font-size:12px}.active{background:#075fc9;color:#fff}.product{display:flex;gap:14px;align-items:center;border:1px solid #e1e8f0;border-radius:14px;padding:14px}.photo{width:62px;height:62px;border-radius:12px;background:#dcecff;display:grid;place-items:center;font-size:25px}button{border:0;border-radius:10px;padding:11px 15px;background:#075fc9;color:#fff;font-weight:700;cursor:pointer}.secondary{background:#eaf2fb;color:#075fc9}.actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:14px}@media(max-width:800px){.grid,.cards{grid-template-columns:1fr}.steps{grid-template-columns:repeat(2,1fr)}}
</style>
<header><div class="wrap"><div class="brand">WASEET</div><div class="muted">وسيط · تجارة · لوجستيات · ثقة</div></div></header>
<main class="wrap">
<section class="hero"><h1>سوق وسيط</h1><p>من طلب المنتج إلى بابك — كل خطوة في منصة واحدة.</p><div class="actions"><button>إنشاء طلب شراء</button><button class="secondary">استكشاف المنتجات</button></div></section>
<div class="grid"><section>
<div class="card"><h2>الصفقة الحالية · WST-001</h2><div class="steps"><div class="step active">تفاوض</div><div class="step ">دفع</div><div class="step ">تحميل</div><div class="step ">نقل</div><div class="step ">فحص</div><div class="step ">تسوية</div><div class="step ">إغلاق</div></div></div>
<div class="card"><h3>عرض مورد</h3><div class="product"><div class="photo">▣</div><div><b>أرز بسمتي — 1,000 كجم</b><div>18,500 ريال · مورد موثّق</div></div></div><div class="actions"><button>اختيار العرض</button><button class="secondary">التفاوض</button><button class="secondary">اتصال صوتي</button></div></div>
</section><aside>
<div class="card"><h3>ملخص الحساب</h3><div class="cards"><div class="metric"><div class="num">12</div>طلبات</div><div class="metric"><div class="num">4</div>صفقات</div><div class="metric"><div class="num">1</div>شحنة</div></div></div>
<div class="card"><h3>المحادثات</h3><p>المورد · آخر رسالة قبل 2 دقيقة</p><button>فتح المحادثة</button></div>
</aside></div></main><script src="/shared/supabase.js"></script>
<script>WaseetData.session().then(s=>{document.body.dataset.connected=s?"authenticated":"guest";});</script>
</html>
