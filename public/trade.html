<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Waseet Trade</title><style>*{box-sizing:border-box}body{margin:0;font-family:Arial;background:#f4f8fc;color:#10243e}.top{background:#075fc9;color:#fff;padding:18px}.wrap{max-width:1150px;margin:auto;padding:18px}.card{background:#fff;border-radius:18px;padding:18px;margin:12px 0;box-shadow:0 7px 24px #1231}.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}input,select,textarea{width:100%;padding:12px;border:1px solid #d5e0ed;border-radius:10px;margin:5px 0 9px}button{border:0;border-radius:10px;padding:11px 15px;background:#075fc9;color:white;font-weight:700;cursor:pointer}.secondary{background:#eaf2fb;color:#075fc9}.danger{background:#b42318}.hide{display:none}.muted{color:#64748b;font-size:13px}.row{display:flex;gap:8px;flex-wrap:wrap}.item{border:1px solid #e0e8f2;border-radius:12px;padding:12px;margin:8px 0}.chat{max-height:320px;overflow:auto;background:#f7f9fc;padding:10px;border-radius:12px}.msg{padding:8px 10px;border-radius:10px;background:white;margin:6px 0}.mine{border-right:4px solid #075fc9}.step{font-weight:700}@media(max-width:800px){.grid{grid-template-columns:1fr 1fr}}@media(max-width:520px){.grid{grid-template-columns:1fr}}</style></head><body><header class="top"><div class="wrap"><b>WASEET TRADE</b><div>وسيط · تجارة · لوجستيات · ثقة</div></div></header><main class="wrap">
<section id="auth" class="card"><h2>دخول / إنشاء حساب</h2><select id="role"><option value="merchant">تاجر</option><option value="supplier">مورد</option></select><input id="email" type="email" placeholder="البريد الإلكتروني"><input id="phone" placeholder="+9665xxxxxxxx"><div class="row"><button onclick="emailLogin()">رابط دخول بالبريد</button><button class="secondary" onclick="phoneLogin()">رمز SMS</button></div><div id="verify" class="hide"><input id="otp" placeholder="رمز التحقق"><button onclick="verifyPhone()">تحقق</button></div><p id="msg" class="muted"></p></section>
<section id="onboard" class="card hide"><h2>إكمال ملف المنشأة</h2><input id="name" placeholder="الاسم الكامل"><input id="biz" placeholder="اسم المنشأة"><input id="addr" placeholder="عنوان النشاط"><button onclick="saveProfile()">حفظ الملف</button><p class="muted">سيتم لاحقاً ربط المستندات الرسمية ورفعها للمراجعة.</p></section>
<section id="app" class="hide"><div class="card"><h2 id="welcome"></h2><div class="row"><button class="secondary" onclick="show('market')">السوق والطلبات</button><button class="secondary" onclick="show('dealsBox')">الصفقات والدردشة</button><button class="secondary" onclick="showShipping()">الشحن</button><button onclick="logout()">تسجيل الخروج</button></div></div>
<div class="grid"><div class="card"><b id="rc">0</b><br>الطلبات</div><div class="card"><b id="oc">0</b><br>العروض</div><div class="card"><b id="dc">0</b><br>الصفقات</div><div class="card"><b id="pc">0</b><br>المنتجات</div></div>
<section id="market"><div id="merchant" class="card hide"><h2>إنشاء طلب شراء</h2><input id="pn" placeholder="اسم المنتج"><input id="qty" type="number" placeholder="الكمية"><input id="weight" type="number" placeholder="الوزن"><input id="origin" placeholder="بلد المنشأ"><input id="dest" placeholder="الوجهة"><input id="prodDate" type="date"><textarea id="desc" placeholder="الوصف والمواصفات"></textarea><button onclick="createRequest()">نشر الطلب لجميع الموردين</button></div>
<div id="supplier" class="card hide"><h2>طلبات التجار المتاحة</h2><div id="requests"></div><h2>إضافة منتج</h2><input id="prod" placeholder="اسم المنتج"><input id="price" type="number" placeholder="السعر"><input id="pqty" type="number" placeholder="الكمية"><input id="pOrigin" placeholder="بلد المنشأ"><button onclick="addProduct()">نشر المنتج</button></div>
<div class="card"><h2>المنتجات والعروض</h2><div id="products"></div><div id="offers"></div></div></section>
<section id="shippingBox" class="card hide">
<h2>الشحن</h2>
<div id="shippingList"></div>
<div class="item">
<h3>طلب شحن لصفقة</h3>
<select id="shipDeal"></select>
<input id="shipInvoice" placeholder="رابط/ملف الفاتورة المستخرجة من وسيط">
<input id="loadAddress" placeholder="موقع التحميل">
<input id="deliveryAddress" placeholder="موقع التنزيل">
<input id="shipWeight" type="number" placeholder="الوزن بالكيلو">
<select id="vehicleType"><option value="">نوع المركبة</option><option>دينا</option><option>تريلا</option><option>شاحنة</option><option>مبردة</option></select>
<label><input id="refrigerated" type="checkbox"> شحن مبرد</label>
<button onclick="requestShipping()">إرسال طلب الشحن للإدارة</button>
<p id="shippingMsg" class="muted"></p>
</div>
</section><section id="dealsBox" class="card"><h2>الصفقات</h2><div id="deals"></div><div id="chatBox" class="hide"><h3 id="chatTitle"></h3><div id="chat" class="chat"></div><div class="row"><input id="chatInput" placeholder="اكتب رسالة محفوظة وغير قابلة للحذف"><button onclick="sendChat()">إرسال</button><button class="secondary" onclick="startCall()">اتصال صوتي</button></div><p id="chatStatus" class="muted"></p></div>
<div id="dealOps" class="card hide"><h3>دورة الصفقة</h3><div id="timeline"></div><div class="row"><button class="secondary" onclick="loadDealOps()">تحديث الحالة</button><button class="secondary" onclick="printInvoice()">إنشاء فاتورة PDF</button><button class="secondary" onclick="printChat()">طباعة/حفظ المحادثة PDF</button></div><div id="shipmentInfo"></div><div id="inspectionInfo"></div></div></section></section></main>
<script src="/shared/supabase.js"></script><script src="/shared/auth.js"></script><script src="/shared/shipping.js"></script><script>
let me,activeDeal,requests=[],offers=[];const M=t=>msg.textContent=t;const esc=s=>String(s??'').replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));function show(id){document.querySelectorAll('#market,#dealsBox').forEach(x=>x.classList.add('hide'));document.getElementById(id).classList.remove('hide')}
async function emailLogin(){let r=await WaseetAuth.sendEmail(email.value.trim());M(r.error?r.error.message:'تم إرسال رابط دخول آمن إلى البريد.')}async function phoneLogin(){pending=phone.value.trim();let r=await WaseetAuth.sendPhone(pending);if(r.error)M(r.error.message);else{verify.classList.remove('hide');M('تم إرسال الرمز')}}async function verifyPhone(){let r=await WaseetAuth.verifyPhone(pending,otp.value.trim());if(r.error)M(r.error.message);else boot()}async function saveProfile(){let r=await WaseetAuth.saveProfile({role:role.value,full_name:name.value,business_name:biz.value,address:addr.value,phone:phone.value||null,email:email.value||null,verification_status:'pending'});if(r.error)M(r.error.message);else boot()}
async function boot(){let s=await WaseetAuth.session();if(!s)return;me=await WaseetAuth.profile();if(!me){auth.classList.add('hide');onboard.classList.remove('hide');return}auth.classList.add('hide');onboard.classList.add('hide');app.classList.remove('hide');welcome.textContent='مرحباً '+(me.business_name||me.full_name||'');merchant.classList.toggle('hide',me.role!=='merchant');supplier.classList.toggle('hide',me.role!=='supplier');await refresh()}
async function refresh(){requests=await WaseetData.requests();offers=(await waseetClient.from('offers').select('*').order('created_at',{ascending:false})).data||[];let ps=await WaseetData.products(),ds=await WaseetData.deals();rc.textContent=me.role==='merchant'?requests.filter(x=>x.merchant_id===me.id).length:requests.length;oc.textContent=offers.filter(x=>me.role==='supplier'?x.supplier_id===me.id:true).length;dc.textContent=ds.length;pc.textContent=ps.filter(x=>x.supplier_id===me.id).length;products.innerHTML=ps.map(p=>'<div class="item"><b>'+esc(p.name)+'</b> · '+esc(p.price)+' ريال · '+esc(p.quantity)+' '+esc(p.unit||'')+'</div>').join('')||'لا توجد منتجات';if(me.role==='supplier')requests.innerHTML=requests.map(r=>'<div class="item"><b>'+esc(r.product_name)+'</b> · الكمية '+esc(r.quantity)+' · '+esc(r.destination||'')+'<div><button onclick="makeOffer(\''+r.id+'\')">تقديم عرض</button></div></div>').join('')||'لا توجد طلبات';if(me.role==='merchant')offersBox();deals.innerHTML=ds.map(d=>'<div class="item"><b>صفقة '+d.id.slice(0,8)+'</b> · <span class="step">'+esc(d.stage)+'</span> · '+esc(d.total_amount)+' ريال · '+esc(d.status)+'<div class="row"><button onclick="openDeal(\''+d.id+'\')">فتح التفاوض</button><button class="secondary" onclick="payRecord(\''+d.id+'\','+Number(d.total_amount||0)+')">تسجيل الدفع</button><button class="secondary" onclick="openDispute(\''+d.id+'\')">نزاع</button></div></div>').join('')||'لا توجد صفقات'}
function offersBox(){let box=document.getElementById('offers');let offersBoxEl=offers.filter(o=>requests.some(r=>r.id===o.request_id&&r.merchant_id===me.id));box.innerHTML=offersBoxEl.map(o=>'<div class="item">عرض '+o.id.slice(0,8)+' · '+o.unit_price+' ريال × '+o.quantity+' · شحن '+(o.shipping_cost||0)+'<button onclick="acceptOffer(\''+o.id+'\')">قبول العرض وإنشاء الصفقة</button></div>').join('')||'لا توجد عروض'}
async function makeOffer(rid){let price=prompt('سعر الوحدة؟');if(!price)return;let qty=prompt('الكمية؟');if(!qty)return;let ship=prompt('تكلفة الشحن؟','0')||0;let r=await waseetClient.from('offers').insert({request_id:rid,supplier_id:me.id,unit_price:+price,quantity:+qty,shipping_cost:+ship,status:'submitted'});alert(r.error?r.error.message:'تم إرسال العرض');refresh()}
async function acceptOffer(oid){let o=offers.find(x=>x.id===oid);let r=requests.find(x=>x.id===o.request_id);let total=Number(o.unit_price)*Number(o.quantity)+Number(o.shipping_cost||0);let x=await waseetClient.from('deals').insert({request_id:r.id,offer_id:o.id,merchant_id:r.merchant_id,supplier_id:o.supplier_id,total_goods:Number(o.unit_price)*Number(o.quantity),shipping_cost:Number(o.shipping_cost||0),total_amount:total,stage:'negotiation',status:'open'}).select().single();if(x.error)alert(x.error.message);else{await waseetClient.from('offers').update({status:'accepted'}).eq('id',oid);refresh()}}
async function createRequest(){let s=await WaseetAuth.session();let r=await waseetClient.from('purchase_requests').insert({merchant_id:s.user.id,product_name:pn.value,quantity:+qty.value,weight:+weight.value||null,origin_country:origin.value,destination:dest.value,production_date:prodDate.value||null,description:desc.value,status:'open'});M(r.error?r.error.message:'تم نشر الطلب');if(!r.error)refresh()}
async function addProduct(){let r=await waseetClient.from('products').insert({supplier_id:me.id,name:prod.value,price:+price.value,quantity:+pqty.value,origin_country:pOrigin.value,status:'active'});M(r.error?r.error.message:'تم نشر المنتج');if(!r.error)refresh()}
async function showShipping(){show('shippingBox');let ds=await WaseetData.deals();let open=ds.filter(d=>['closing'].includes(d.stage)||d.status==='completed');shipDeal.innerHTML=open.map(d=>'<option value="'+d.id+'">صفقة '+d.id.slice(0,8)+' · '+esc(d.total_amount)+'</option>').join('')||'<option value="">لا توجد صفقات مكتملة</option>';let ss=await WaseetShipping.mine();shippingList.innerHTML=ss.map(s=>'<div class="item">شحنة '+s.id.slice(0,8)+' · '+esc(s.status)+' · السعر '+esc(s.approved_price||s.manual_price||'بانتظار التسعير')+'</div>').join('')||'لا توجد طلبات شحن';}
async function requestShipping(){let id=shipDeal.value;if(!id)return;let r=await WaseetShipping.request(id,{invoice_url:shipInvoice.value,loading_address:loadAddress.value,delivery_address:deliveryAddress.value,weight_kg:+shipWeight.value||null,vehicle_type:vehicleType.value,refrigerated:refrigerated.checked});shippingMsg.textContent=r.error?r.error.message:'تم إرسال طلب الشحن للإدارة بالتسعير اليدوي.';if(!r.error)showShipping();}
async function openDeal(id){activeDeal=id;show('dealsBox');chatBox.classList.remove('hide');dealOps.classList.remove('hide');let d=(await waseetClient.from('deals').select('*').eq('id',id).single()).data;chatTitle.textContent='تفاوض الصفقة '+id.slice(0,8);await renderChat();if(window.chatSub)waseetClient.removeChannel(window.chatSub);window.chatSub=WaseetData.watchMessages(id,()=>renderChat());await loadDealOps()}
async function renderChat(){let ms=await WaseetData.messages(activeDeal);chat.innerHTML=ms.map(m=>'<div class="msg '+(m.sender_id===me.id?'mine':'')+'"><b>'+m.sender_id.slice(0,8)+'</b><br>'+esc(m.body)+'<small class="muted"><br>'+new Date(m.created_at).toLocaleString('ar-SA')+'</small></div>').join('')||'لا توجد رسائل';chat.scrollTop=chat.scrollHeight}
async function loadDealOps(){if(!activeDeal)return;let d=(await waseetClient.from('deals').select('*').eq('id',activeDeal).single()).data;let sh=await WaseetData.shipment(activeDeal),ins=await WaseetData.inspection(activeDeal),pay=await WaseetData.payment(activeDeal),ev=await WaseetData.events(activeDeal);let stages=['negotiation','payment','loading','transport','inspection','settlement','closing'];timeline.innerHTML=stages.map(s=>'<div class="item">'+(s===d.stage?'▶ ':'')+s+'</div>').join('');shipmentInfo.innerHTML=sh?'<div class="item"><b>الشحنة:</b> '+esc(sh.status)+' · اللوحة '+esc(sh.vehicle_plate||'')+' · الوصول '+esc(sh.expected_arrival||'')+' · الموقع '+esc(sh.current_lat||'')+', '+esc(sh.current_lng||'')+'</div>':'<div class="item">لا توجد بيانات شحنة بعد</div>';inspectionInfo.innerHTML=ins?'<div class="item"><b>الفحص:</b> '+esc(ins.result||'pending')+' · '+esc(ins.notes||'')+'</div>':'<div class="item">لم يبدأ الفحص بعد</div>';chatStatus.textContent='الدفع: '+(pay?.status||'غير مسجل')+' · الأحداث: '+ev.length}
function printInvoice(){if(!activeDeal)return;let w=window.open('','_blank');w.document.write('<html dir="rtl"><body style="font-family:Arial;padding:30px"><h1>Waseet — فاتورة إلكترونية</h1><p>رقم الصفقة: '+activeDeal+'</p><p>المبلغ: '+(document.querySelector('#deals .item')?.textContent||'راجع الصفقة')+'</p><p>تم الإصدار من منصة وسيط</p><script>window.print()<\/script></body></html>');w.document.close()}
async function printChat(){if(!activeDeal)return;let ms=await WaseetData.messages(activeDeal);let html=ms.map(m=>'<p><b>'+m.sender_id+'</b>: '+esc(m.body)+'<br><small>'+m.created_at+'</small></p>').join('');let w=window.open('','_blank');w.document.write('<html dir="rtl"><body style="font-family:Arial;padding:30px"><h1>محادثة الصفقة '+activeDeal+'</h1>'+html+'<script>window.print()<\/script></body></html>');w.document.close()}
async function sendChat(){if(!chatInput.value.trim()||!activeDeal)return;let r=await WaseetData.sendMessage(activeDeal,chatInput.value.trim());if(r.error)chatStatus.textContent=r.error.message;else chatInput.value=''}
async function startCall(){if(!activeDeal)return;let d=(await waseetClient.from('deals').select('merchant_id,supplier_id').eq('id',activeDeal).single()).data;let callee=me.id===d.merchant_id?d.supplier_id:d.merchant_id;let r=await waseetClient.from('voice_calls').insert({deal_id:activeDeal,caller_id:me.id,callee_id:callee,status:'ringing'});chatStatus.textContent=r.error?r.error.message:'تم تسجيل طلب الاتصال. ربط مزود الصوت الحقيقي متبقٍ.'}
async function payRecord(id,amount){let r=await waseetClient.from('payments').insert({deal_id:id,amount,method:'bank_transfer',status:'pending'});alert(r.error?'تعذر التسجيل: '+r.error.message:'تم تسجيل الدفع بانتظار اعتماد الإدارة.')}
async function openDispute(id){let reason=prompt('سبب النزاع؟');if(!reason)return;let r=await waseetClient.from('disputes').insert({deal_id:id,opened_by:me.id,reason,status:'open'});alert(r.error?r.error.message:'تم فتح النزاع')}
async function logout(){await WaseetAuth.signOut();location.reload()}boot();waseetClient.auth.onAuthStateChange(()=>setTimeout(boot,200));
</script></body></html>
