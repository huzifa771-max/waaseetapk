<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Waseet Admin</title><style>*{box-sizing:border-box}body{margin:0;font-family:Arial;background:#f4f8fc;color:#10243e}.top{background:#075fc9;color:#fff;padding:18px}.wrap{max-width:1200px;margin:auto;padding:18px}.card{background:#fff;border-radius:18px;padding:18px;margin:12px 0;box-shadow:0 7px 24px #1231}.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}.item{border:1px solid #e0e8f2;border-radius:12px;padding:12px;margin:8px 0}input,textarea{width:100%;padding:12px;border:1px solid #d5e0ed;border-radius:10px;margin:5px 0 9px}button{border:0;border-radius:10px;padding:11px 15px;background:#075fc9;color:#fff;font-weight:700}.secondary{background:#eaf2fb;color:#075fc9}.hide{display:none}.muted{color:#64748b;font-size:13px}.row{display:flex;gap:8px;flex-wrap:wrap}@media(max-width:800px){.grid{grid-template-columns:1fr 1fr}}@media(max-width:520px){.grid{grid-template-columns:1fr}}</style></head><body><header class="top"><div class="wrap"><b>WASEET ADMIN</b><div>Control Tower · إدارة مركزية</div></div></header><main class="wrap"><section id="auth" class="card"><h2>دخول الإدارة الآمن</h2><p class="muted">سيصل رابط دخول آمن إلى البريد الإداري. لا يوجد اعتماد على كلمة مرور داخل التطبيق.</p><input id="email" type="email" placeholder="البريد الإداري"><button onclick="login()">إرسال رابط الدخول</button><p id="msg" class="muted"></p></section><section id="app" class="hide"><div class="card"><h2>مركز التحكم</h2><p id="who"></p><button onclick="logout()">خروج</button></div><div class="grid"><div class="card"><b id="u">0</b><br>المستخدمون</div><div class="card"><b id="r">0</b><br>الطلبات</div><div class="card"><b id="d">0</b><br>الصفقات</div><div class="card"><b id="x">0</b><br>النزاعات</div></div><div class="card"><h2>مراجعة الحسابات والمستندات</h2><div id="users"></div></div><div class="card"><h2>الصفقات</h2><div id="rows"></div></div><div class="card"><h2>الدفع والشحن والفحص</h2><div id="ops"></div></div><div class="card"><h2>النزاعات المفتوحة</h2><div id="disputes"></div></div></section></main><script src="/shared/supabase.js"></script><script src="/shared/auth.js"></script><script>
async function login(){let r=await WaseetAuth.sendEmail(email.value.trim());msg.textContent=r.error?r.error.message:'تم إرسال رابط الدخول الآمن إلى البريد.'}
async function boot(){let s=await WaseetAuth.session();if(!s)return;let p=await WaseetAuth.profile();if(!p||p.role!=='admin'){await WaseetAuth.signOut();msg.textContent='الحساب غير مصرح له بالإدارة';return}auth.classList.add('hide');app.classList.remove('hide');who.textContent=p.email||s.user.email;let [u,r,ds,x,docs]=await Promise.all([waseetClient.from('profiles').select('id',{count:'exact',head:true}),waseetClient.from('purchase_requests').select('id',{count:'exact',head:true}),waseetClient.from('deals').select('*').order('updated_at',{ascending:false}),waseetClient.from('disputes').select('*').eq('status','open').order('created_at',{ascending:false}),waseetClient.from('profile_documents').select('*').order('created_at',{ascending:false})]);uEl=u.count||0;rEl=r.count||0;dEl=ds.data?.length||0;xEl=x.data?.length||0;u.textContent=uEl;r.textContent=rEl;d.textContent=dEl;x.textContent=xEl;let prof=(await waseetClient.from('profiles').select('*').order('created_at',{ascending:false})).data||[];users.innerHTML=prof.map(q=>'<div class="item"><b>'+esc(q.business_name||q.full_name||q.id.slice(0,8))+'</b> · '+q.role+' · '+(q.verification_status||'pending')+(q.role!=='admin'&&q.verification_status!=='approved'?'<div class="row"><button onclick="approve(\''+q.id+'\')">اعتماد</button></div>':'')+'</div>').join('')||'لا يوجد';rows.innerHTML=(ds.data||[]).map(q=>'<div class="item"><b>'+q.id.slice(0,8)+'</b> · '+q.stage+' · '+q.status+' · '+q.total_amount+' ريال</div>').join('')||'لا توجد';let pays=(await waseetClient.from('payments').select('*,deals(id,merchant_id,supplier_id)').order('created_at',{ascending:false})).data||[];let ships=(await waseetClient.from('shipments').select('*').order('updated_at',{ascending:false})).data||[];let insps=(await waseetClient.from('inspections').select('*').order('created_at',{ascending:false})).data||[];ops.innerHTML='<h3>مدفوعات</h3>'+pays.map(p=>'<div class="item">'+p.deal_id.slice(0,8)+' · '+p.amount+' ريال · '+p.status+' '+(p.status==='pending'?'<button onclick="verifyPay(\\''+p.id+'\\')">اعتماد</button>':'')+'</div>').join('')+'<h3>شحنات</h3>'+ships.map(s=>'<div class="item">'+s.deal_id.slice(0,8)+' · '+s.status+' · '+(s.vehicle_plate||'')+' · '+(s.current_lat||'')+','+(s.current_lng||'')+'</div>').join('')+'<h3>فحوصات</h3>'+insps.map(i=>'<div class="item">'+i.deal_id.slice(0,8)+' · '+(i.result||'pending')+' · '+esc(i.notes||'')+' <button onclick="setInspection(\\''+i.id+'\\')">تحديث</button></div>').join('');disputes.innerHTML=(x.data||[]).map(q=>'<div class="item"><b>'+q.id.slice(0,8)+'</b><br>'+esc(q.reason)+'<br><button onclick="resolve(\''+q.id+'\')">حل النزاع</button></div>').join('')||'لا توجد نزاعات مفتوحة'}
async function verifyPay(id){let r=await waseetClient.from('payments').update({status:'verified',verified_by:(await WaseetAuth.session()).user.id,verified_at:new Date().toISOString()}).eq('id',id);if(r.error)alert(r.error.message);boot()}
async function setInspection(id){let result=prompt('النتيجة: passed / failed / partial','passed');if(!result)return;let notes=prompt('ملاحظات الفحص','');let r=await waseetClient.from('inspections').update({result,notes,inspector_id:(await WaseetAuth.session()).user.id}).eq('id',id);if(r.error)alert(r.error.message);boot()}
const esc=s=>String(s??'').replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));async function approve(id){let r=await waseetClient.from('profiles').update({verification_status:'approved'}).eq('id',id);alert(r.error?r.error.message:'تم الاعتماد');boot()}async function resolve(id){let note=prompt('قرار الإدارة؟');if(!note)return;let r=await waseetClient.from('disputes').update({status:'resolved',resolution:note,resolved_at:new Date().toISOString()}).eq('id',id);alert(r.error?r.error.message:'تم حل النزاع');boot()}async function logout(){await WaseetAuth.signOut();location.reload()}boot();waseetClient.auth.onAuthStateChange(()=>setTimeout(boot,200));
</script></body></html>
