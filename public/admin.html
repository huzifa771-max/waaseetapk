<!doctype html><html lang="ar" dir="rtl"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Waseet Admin</title><style>*{box-sizing:border-box}body{margin:0;font-family:Arial;background:#f5f8fc;color:#10243e}.top{background:#075fc9;color:#fff;padding:18px}.wrap{max-width:1100px;margin:auto;padding:18px}.card{background:#fff;border-radius:18px;padding:20px;margin:14px 0;box-shadow:0 8px 26px #1231 0 0 0}input,select,textarea{width:100%;padding:12px;border:1px solid #d8e2ee;border-radius:10px;margin:6px 0 10px}button{border:0;border-radius:10px;padding:12px 16px;background:#075fc9;color:#fff;font-weight:700}.secondary{background:#eaf2fb;color:#075fc9}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}.hide{display:none}.muted{color:#60738a;font-size:13px}@media(max-width:800px){.grid{grid-template-columns:1fr}} </style><header class="top"><div class="wrap"><b>WASEET ADMIN</b><div>Control Tower</div></div></header><main class="wrap"><section id="auth" class="card"><h2>دخول الإدارة الآمن</h2><p class="muted">لا نستخدم OTP كشرط وحيد. سيصل إلى البريد رابط موافقة آمن؛ الضغط عليه يفتح الجلسة.</p><input id="email" type="email" placeholder="البريد الإداري"><button onclick="login()">إرسال رابط الموافقة</button><p id="msg" class="muted"></p></section><section id="app" class="hide"><div class="card"><h1>مركز التحكم</h1><p id="who"></p><button onclick="logout()">خروج</button></div><div class="grid"><div class="card"><b id="u">0</b><br>المستخدمون</div><div class="card"><b id="r">0</b><br>الطلبات</div><div class="card"><b id="d">0</b><br>الصفقات</div><div class="card"><b id="x">0</b><br>النزاعات</div></div><div class="card"><h2>الصفقات الحقيقية</h2><div id="rows"></div></div></section></main><script src="/shared/supabase.js"></script><script src="/shared/auth.js"></script><script>
async function login(){let r=await WaseetAuth.sendEmail(email.value.trim());msg.textContent=r.error?r.error.message:'تم إرسال رابط الموافقة إلى البريد. افتحه للدخول.'}async function boot(){let s=await WaseetAuth.session();if(!s)return;let p=await WaseetAuth.profile();if(!p||p.role!=='admin'){await WaseetAuth.signOut();msg.textContent='الحساب غير مصرح له بالإدارة';return}auth.classList.add('hide');app.classList.remove('hide');who.textContent=p.email||s.user.email;let [a,b,c,e]=await Promise.all([waseetClient.from('profiles').select('id',{count:'exact',head:true}),waseetClient.from('purchase_requests').select('id',{count:'exact',head:true}),waseetClient.from('deals').select('*').order('updated_at',{ascending:false}),waseetClient.from('disputes').select('id',{count:'exact',head:true})]);u.textContent=a.count||0;r.textContent=b.count||0;d.textContent=c.data?.length||0;x.textContent=e.count||0;rows.innerHTML=(c.data||[]).map(q=>'<div class="card">'+q.id.slice(0,8)+' · '+q.stage+' · '+q.total_amount+' ريال · '+q.status+'</div>').join('')||'لا توجد بيانات'}async function logout(){await WaseetAuth.signOut();location.reload()}boot();waseetClient.auth.onAuthStateChange(()=>setTimeout(boot,100));</script></html>
