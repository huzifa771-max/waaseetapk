name: Build Waseet 3 APKs
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    strategy:
      matrix:
        include:
          - role: trade
            source: public/app.html
            appId: sa.waseet.trade
            appName: Waseet Trade
            apk: waseet-trade-32bit.apk
          - role: driver
            source: public/app.html
            appId: sa.waseet.driver
            appName: Waseet Driver
            apk: waseet-driver-32bit.apk
          - role: admin
            source: public/index.html
            appId: sa.waseet.admin
            appName: Waseet Admin
            apk: waseet-admin-32bit.apk
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Prepare role application
        run: |
          rm -rf public-build
          mkdir public-build
          cp -r public/. public-build/
          cp "${{ matrix.source }}" public-build/index.html
          if [ "${{ matrix.role }}" = "driver" ]; then
            python3 - <<'PY'
from pathlib import Path
p=Path("public-build/index.html")
s=p.read_text()
s=s.replace("let current=0, role='merchant';","let current=0, role='driver';")
s=s.replace(".roles{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}",".roles{display:none}")
p.write_text(s)
PY
          fi
      - name: Generate Capacitor config
        run: |
          cat > capacitor.config.json <<EOF
{
  "appId": "${{ matrix.appId }}",
  "appName": "${{ matrix.appName }}",
  "webDir": "public-build",
  "bundledWebRuntime": false,
  "server": {
    "androidScheme": "https",
    "hostname": "waseet.local",
    "cleartext": false
  },
  "android": {
    "allowMixedContent": false,
    "captureInput": true,
    "webContentsDebuggingEnabled": true,
    "backgroundColor": "#075fc9"
  },
  "plugins": {
    "SplashScreen": {
      "launchShowDuration": 1200,
      "launchAutoHide": true,
      "backgroundColor": "#075fc9"
    },
    "StatusBar": {
      "style": "DARK",
      "backgroundColor": "#075fc9"
    }
  }
}
EOF
      - run: npm install
      - run: npx cap add android
      - run: npx cap sync android
      - name: Configure 32-bit ARM
        run: |
          cat >> android/app/build.gradle <<'EOF'
android {
    defaultConfig {
        ndk {
            abiFilters "armeabi-v7a"
        }
    }
}
EOF
      - name: Build APK
        run: cd android && ./gradlew assembleDebug --stacktrace
      - name: Verify and rename
        run: |
          test -s android/app/build/outputs/apk/debug/app-debug.apk
          cp android/app/build/outputs/apk/debug/app-debug.apk "${{ matrix.apk }}"
          ls -lh "${{ matrix.apk }}"
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.role }}-32bit-apk
          path: ${{ matrix.apk }}
  release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: release-assets
          pattern: "*-32bit-apk"
          merge-multiple: true
      - name: Release 3 APKs
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="v13.0.0-3apps.${{ github.run_number }}"
          gh release create "$TAG" release-assets/*.apk --title "Waseet 3 Apps - 32-bit $TAG" --generate-notes
