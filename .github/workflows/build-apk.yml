name: Build Waseet APK
on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - run: npm install
      - run: npx cap add android
      - run: npx cap sync android

      - name: Configure 32-bit ARM APK
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path("android/app/build.gradle")
          s = p.read_text()
          block = '''
          android {
              defaultConfig {
                  ndk {
                      abiFilters "armeabi-v7a"
                  }
              }
          }
          '''
          p.write_text(s.rstrip() + "\n" + block)
          print("Configured ABI: armeabi-v7a")
          PY
          grep -n -A8 -B2 'abiFilters' android/app/build.gradle

      - name: Build 32-bit debug APK
        run: cd android && ./gradlew assembleDebug --stacktrace

      - name: Verify APK
        shell: bash
        run: |
          test -s android/app/build/outputs/apk/debug/app-debug.apk
          unzip -l android/app/build/outputs/apk/debug/app-debug.apk | grep -E '(^|/)lib/armeabi-v7a/' || true
          echo "APK created successfully:"
          ls -lh android/app/build/outputs/apk/debug/app-debug.apk

      - uses: actions/upload-artifact@v4
        with:
          name: waseet-debug-apk-32bit
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
