name: Build Waseet APK
on:
  push:
    branches: [main]
  workflow_dispatch:
jobs:
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm install
      - run: npx cap add android
      - run: npx cap sync android
      - name: Configure 32-bit Android APK
        run: |
          printf '\nandroid { defaultConfig { ndk { abiFilters "armeabi-v7a" } } }\n' >> android/app/build.gradle
      - run: cd android && ./gradlew assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: waseet-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
