name: Build and Release Waseet APK
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install dependencies
        run: npm install

      - name: Add Android platform
        run: npx cap add android

      - name: Sync Capacitor
        run: npx cap sync android

      - name: Configure 32-bit ARM APK
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path("android/app/build.gradle")
          s = p.read_text()
          block = '''
          android {
              defaultConfig {
                  ndk {
                      abiFilters "armeabi-v7a"
                  }
              }
          }
          '''
          p.write_text(s.rstrip() + "\n" + block)
          print("Configured ABI: armeabi-v7a")
          PY
          grep -n -A8 -B2 'abiFilters' android/app/build.gradle

      - name: Build 32-bit debug APK
        run: cd android && ./gradlew assembleDebug --stacktrace

      - name: Verify APK
        shell: bash
        run: |
          test -s android/app/build/outputs/apk/debug/app-debug.apk
          echo "APK created successfully:"
          ls -lh android/app/build/outputs/apk/debug/app-debug.apk

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: waseet-debug-apk-32bit
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      - name: Create GitHub Release and attach APK
        env:
          GH_TOKEN: ${{ github.token }}
          TAG_NAME: v12.0.0-32bit.${{ github.run_number }}
        run: |
          gh release create "$TAG_NAME" \
            android/app/build/outputs/apk/debug/app-debug.apk \
            --title "Waseet 32-bit APK $TAG_NAME" \
            --generate-notes
